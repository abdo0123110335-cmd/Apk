name: elsheikh_customs_app
description: "تطبيق أعمال الشيخ مختار للتخليص الجمركي - إدارة العملاء، قراءة الفواتير وتوليد الـ PDF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  path: ^1.9.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
